{{define "menuItems"}}
<a-menu-item key="{{ .base_path }}aether/">
    <a-icon type="dashboard"></a-icon>
    <span>System Status</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}aether/inbounds">
    <a-icon type="gateway"></a-icon>
    <span>Inbounds</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}aether/clients">
    <a-icon type="team"></a-icon>
    <span>Clients & QR</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}aether/setting">
    <a-icon type="setting"></a-icon>
    <span>Panel Settings</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}logout">
    <a-icon type="logout"></a-icon>
    <span>Logout</span>
</a-menu-item>
{{end}}

{{define "commonSider"}}
<!-- Layout Sider -->
<a-layout-sider id="sider" width="250" breakpoint="md" collapsed-width="0">
    <div class="sider-container">
        <div class="sider-brand" style="background: transparent !important; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 22px 14px 18px; display: flex; justify-content: center; align-items: center;">
            <a href="{{ .base_path }}aether/" style="display: flex; justify-content: center; width: 100%;">
                <img src="{{ .base_path }}assets/images/logo.png" class="brand-logo-img" alt="Aether VPN" 
                     style="width: 200px; max-width: 95%; height: auto; max-height: 110px; background: transparent !important; border: none !important; padding: 0 !important; filter: drop-shadow(0 4px 18px rgba(168, 85, 247, 0.4)); object-fit: contain;"
                     onerror="this.onerror=null;this.src='{{ .base_path }}assets/images/icon.png';">
            </a>
        </div>
        <a-menu theme="dark" mode="inline" :selected-keys="['{{ .request_uri }}']"
                @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
            {{template "menuItems" .}}
        </a-menu>
        <div class="sider-footer">
            <div class="sider-version-tag">
                <span>Version</span>
                <span style="color: #ffffff; font-weight: 700;">{{ .cur_ver }}</span>
            </div>
        </div>
    </div>
</a-layout-sider>
{{end}}

{{define "commonHeader"}}
<a-layout-header class="aether-header">
    <div class="header-left">
        <div class="header-title-box">
            <span class="header-page-title">{{ .title }}</span>
        </div>
    </div>
    <div class="header-right">
        <a-button class="header-logout-btn" icon="logout" @click="location.href='{{ .base_path }}logout'">
            Logout
        </a-button>
    </div>
</a-layout-header>
{{end}}
