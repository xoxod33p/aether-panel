{{define "form/vmess"}}
<div style="margin: 10px 0 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #ffffff; font-size: 13px;">
            <a-icon type="team" style="color: var(--accent-purple); margin-right: 6px;"></a-icon>
            Client Accounts & Usage Limits ([[ inbound.settings.vmesses.length ]])
        </span>
        <a-button type="primary" size="small" icon="plus" @click="inbound.settings.addVmess()"
                  style="border-radius: 6px; background: linear-gradient(135deg, #a855f7, #6366f1); border: none; font-weight: 600;">
            Add Client
        </a-button>
    </div>

    <div v-for="(vmess, index) in inbound.settings.vmesses" :key="index"
         style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <a-tag color="purple" style="font-weight: 700;">Client #[[ index + 1 ]]</a-tag>
                <span v-if="vmess.email" style="font-weight: 600; color: #ffffff; font-size: 13px;">[[ vmess.email ]]</span>
                <span v-if="vmess.totalGB > 0" style="font-size: 11px; color: var(--accent-purple); background: rgba(168, 85, 247, 0.1); padding: 2px 6px; border-radius: 4px;">
                    Limit: [[ vmess.totalGB ]] GB
                </span>
                <span v-else style="font-size: 11px; color: var(--text-dim); background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px;">
                    Unlimited
                </span>
            </div>
            <div>
                <a-popconfirm v-if="inbound.settings.vmesses.length > 1"
                              title="Delete this client?"
                              @confirm="inbound.settings.delVmess(vmess)">
                    <a-button type="danger" size="small" icon="delete" ghost style="border-radius: 4px;"></a-button>
                </a-popconfirm>
            </div>
        </div>

        <a-row :gutter="12">
            <a-col :xs="24" :sm="8">
                <a-form-item label="Client Remark / Email">
                    <a-input v-model.trim="vmess.email" placeholder="e.g. user-01"></a-input>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="12">
                <a-form-item label="UUID / Client ID">
                    <a-input v-model.trim="vmess.id">
                        <a-icon slot="addonAfter" type="sync" style="cursor: pointer;" @click="vmess.id = RandomUtil.randomUUID()" title="Generate new UUID"></a-icon>
                    </a-input>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="4">
                <a-form-item label="Alter ID">
                    <a-input type="number" v-model.number="vmess.alterId"></a-input>
                </a-form-item>
            </a-col>
        </a-row>

        <a-row :gutter="12">
            <a-col :xs="24" :sm="12">
                <a-form-item label="Usage Limit (GB)">
                    <a-input-number v-model="vmess.totalGB" :min="0" style="width: 100%;" placeholder="0 = Unlimited"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="12">
                <a-form-item label="Client Expiry Date">
                    <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                                   v-model="vmess._expiryTime" style="width: 100%;" placeholder="Never Expires"></a-date-picker>
                </a-form-item>
            </a-col>
        </a-row>
    </div>
</div>

<a-form layout="inline" style="margin-top: 10px;">
    <a-form-item label="Disable Insecure Encryption">
        <a-switch v-model.number="inbound.settings.disableInsecure"></a-switch>
    </a-form-item>
</a-form>
{{end}}
