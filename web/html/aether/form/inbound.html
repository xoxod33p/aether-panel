{{define "form/inbound"}}
<!-- base -->
<a-form layout="vertical">
    <a-row :gutter="16">
        <a-col :xs="24" :sm="14">
            <a-form-item label='{{ i18n "remark" }} / User Tag'>
                <a-input v-model.trim="dbInbound.remark" placeholder="e.g. User-01 / Office Proxy"></a-input>
            </a-form-item>
        </a-col>
        <a-col :xs="12" :sm="6">
            <a-form-item label='{{ i18n "protocol" }}'>
                <a-select v-model="inbound.protocol" style="width: 100%;">
                    <a-select-option v-for="p in Protocols" :key="p" :value="p">[[ p.toUpperCase() ]]</a-select-option>
                </a-select>
            </a-form-item>
        </a-col>
        <a-col :xs="12" :sm="4">
            <a-form-item label='{{ i18n "enable" }}'>
                <a-switch v-model="dbInbound.enable" style="margin-top: 4px;"></a-switch>
            </a-form-item>
        </a-col>
    </a-row>

    <a-row :gutter="16">
        <a-col :xs="12" :sm="8">
            <a-form-item label="Port">
                <a-input type="number" v-model.number="inbound.port" placeholder="Port (e.g. 54321)"></a-input>
            </a-form-item>
        </a-col>
        <a-col :xs="12" :sm="16">
            <a-form-item>
                <span slot="label">
                    Listen IP
                    <a-tooltip>
                        <template slot="title">
                            Leave blank or 0.0.0.0 to listen on all interfaces
                        </template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-input v-model.trim="inbound.listen" placeholder="0.0.0.0 (all interfaces)"></a-input>
            </a-form-item>
        </a-col>
    </a-row>

    <!-- Bandwidth Limitation section -->
    <a-divider orientation="left" style="font-size: 13px; color: var(--text-muted); margin: 12px 0 16px;">User Bandwidth & Expiration</a-divider>

    <a-row :gutter="16">
        <a-col :xs="24" :sm="12">
            <a-form-item>
                <span slot="label">
                    Traffic / Bandwidth Limit (GB)
                    <a-tooltip>
                        <template slot="title">
                            Total bandwidth quota for this user. 0 means unlimited.
                        </template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-input-number v-model="dbInbound.totalGB" :min="0" style="width: 100%;" placeholder="0 = Unlimited"></a-input-number>
                <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <a-tag style="cursor: pointer;" @click="dbInbound.totalGB = 0">Unlimited</a-tag>
                    <a-tag style="cursor: pointer;" @click="dbInbound.totalGB = 10">10 GB</a-tag>
                    <a-tag style="cursor: pointer;" @click="dbInbound.totalGB = 50">50 GB</a-tag>
                    <a-tag style="cursor: pointer;" @click="dbInbound.totalGB = 100">100 GB</a-tag>
                    <a-tag style="cursor: pointer;" @click="dbInbound.totalGB = 500">500 GB</a-tag>
                </div>
            </a-form-item>
        </a-col>
        <a-col :xs="24" :sm="12">
            <a-form-item>
                <span slot="label">
                    Account Expiration Date
                    <a-tooltip>
                        <template slot="title">
                            Leave blank for perpetual access
                        </template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                               v-model="dbInbound._expiryTime" style="width: 100%;" placeholder="Never Expires"></a-date-picker>
                <div style="margin-top: 6px;">
                    <a-tag v-if="dbInbound._expiryTime" style="cursor: pointer;" @click="dbInbound._expiryTime = null">Clear Expiry</a-tag>
                </div>
            </a-form-item>
        </a-col>
    </a-row>
</a-form>

<!-- vmess settings -->
<template v-if="inbound.protocol === Protocols.VMESS">
    {{template "form/vmess"}}
</template>

<!-- vless settings -->
<template v-if="inbound.protocol === Protocols.VLESS">
    {{template "form/vless"}}
</template>

<!-- trojan settings -->
<template v-if="inbound.protocol === Protocols.TROJAN">
    {{template "form/trojan"}}
</template>

<!-- shadowsocks -->
<template v-if="inbound.protocol === Protocols.SHADOWSOCKS">
    {{template "form/shadowsocks"}}
</template>

<!-- dokodemo-door -->
<template v-if="inbound.protocol === Protocols.DOKODEMO">
    {{template "form/dokodemo"}}
</template>

<!-- socks -->
<template v-if="inbound.protocol === Protocols.SOCKS">
    {{template "form/socks"}}
</template>

<!-- http -->
<template v-if="inbound.protocol === Protocols.HTTP">
    {{template "form/http"}}
</template>

<!-- stream settings -->
<template v-if="inbound.canEnableStream()">
    {{template "form/streamSettings"}}
</template>

<!-- tls settings -->
<template v-if="inbound.canEnableTls()">
    {{template "form/tlsSettings"}}
</template>
{{end}}
