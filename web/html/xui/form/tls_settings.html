{{define "form/tlsSettings"}}
<!-- tls enable -->
<a-form layout="inline" v-if="inbound.canSetTls()">
    <a-form-item label="TLS">
        <a-switch v-model="inbound.tls">
        </a-switch>
    </a-form-item>
    <a-form-item v-if="inbound.canEnableXTls()" label="XTLS">
        <a-switch v-model="inbound.xtls"></a-switch>
    </a-form-item>
</a-form>

<!-- tls settings -->
<a-form v-if="inbound.tls || inbound.xtls"
        layout="inline">
    <a-form-item label="Domain (SNI)">
        <a-input v-model.trim="inbound.stream.tls.server" placeholder="example.com"></a-input>
    </a-form-item>
    <a-form-item label="Certificate Mode">
        <a-radio-group v-model="inbound.stream.tls.certs[0].useFile"
                       button-style="solid">
            <a-radio-button :value="true">File Path</a-radio-button>
            <a-radio-button :value="false">File Content</a-radio-button>
        </a-radio-group>
    </a-form-item>
    <template v-if="inbound.stream.tls.certs[0].useFile">
        <a-form-item label="Certificate Path">
            <a-input v-model.trim="inbound.stream.tls.certs[0].certFile" placeholder="/path/to/fullchain.cer"></a-input>
        </a-form-item>
        <a-form-item label="Private Key Path">
            <a-input v-model.trim="inbound.stream.tls.certs[0].keyFile" placeholder="/path/to/private.key"></a-input>
        </a-form-item>
    </template>
    <template v-else>
        <a-form-item label="Certificate Content">
            <a-input type="textarea" :rows="2"
                     v-model="inbound.stream.tls.certs[0].cert" placeholder="-----BEGIN CERTIFICATE-----"></a-input>
        </a-form-item>
        <a-form-item label="Private Key Content">
            <a-input type="textarea" :rows="2"
                     v-model="inbound.stream.tls.certs[0].key" placeholder="-----BEGIN RSA PRIVATE KEY-----"></a-input>
        </a-form-item>
    </template>
</a-form>
{{end}}
