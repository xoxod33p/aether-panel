{{define "form/vless"}}
<div style="margin: 10px 0 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #ffffff; font-size: 13px;">
            <a-icon type="team" style="color: var(--accent-cyan); margin-right: 6px;"></a-icon>
            Client Accounts & Usage Limits ([[ inbound.settings.vlesses.length ]])
        </span>
        <a-button type="primary" size="small" icon="plus" @click="inbound.settings.addVless()"
                  style="border-radius: 6px; background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; font-weight: 600;">
            Add Client
        </a-button>
    </div>

    <div v-for="(vless, index) in inbound.settings.vlesses" :key="index"
         style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <a-tag color="blue" style="font-weight: 700;">Client #[[ index + 1 ]]</a-tag>
                <span v-if="vless.email" style="font-weight: 600; color: #ffffff; font-size: 13px;">[[ vless.email ]]</span>
                <span v-if="vless.totalGB > 0" style="font-size: 11px; color: var(--accent-cyan); background: rgba(0, 242, 254, 0.1); padding: 2px 6px; border-radius: 4px;">
                    Limit: [[ vless.totalGB ]] GB
                </span>
                <span v-else style="font-size: 11px; color: var(--text-dim); background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px;">
                    Unlimited
                </span>
            </div>
            <div>
                <a-popconfirm v-if="inbound.settings.vlesses.length > 1"
                              title="Delete this client?"
                              @confirm="inbound.settings.delVless(vless)">
                    <a-button type="danger" size="small" icon="delete" ghost style="border-radius: 4px;"></a-button>
                </a-popconfirm>
            </div>
        </div>

        <a-row :gutter="12">
            <a-col :xs="24" :sm="8">
                <a-form-item label="Client Remark / Email">
                    <a-input v-model.trim="vless.email" placeholder="e.g. user-01"></a-input>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="16">
                <a-form-item label="UUID / Client ID">
                    <a-input v-model.trim="vless.id">
                        <a-icon slot="addonAfter" type="sync" style="cursor: pointer;" @click="vless.id = RandomUtil.randomUUID()" title="Generate new UUID"></a-icon>
                    </a-input>
                </a-form-item>
            </a-col>
        </a-row>

        <a-row :gutter="12">
            <a-col :xs="24" :sm="8">
                <a-form-item label="Usage Limit (GB)">
                    <a-input-number v-model="vless.totalGB" :min="0" style="width: 100%;" placeholder="0 = Unlimited"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="8">
                <a-form-item label="Client Expiry Date">
                    <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                                   v-model="vless._expiryTime" style="width: 100%;" placeholder="Never Expires"></a-date-picker>
                </a-form-item>
            </a-col>
            <a-col :xs="24" :sm="8" v-if="inbound.xtls || inbound.tls">
                <a-form-item label="Flow">
                    <a-select v-model="vless.flow" style="width: 100%">
                        <a-select-option value="">None</a-select-option>
                        <a-select-option v-for="(val, key) in FLOW_CONTROL" :key="key" :value="val">[[ val ]]</a-select-option>
                    </a-select>
                </a-form-item>
            </a-col>
        </a-row>
    </div>
</div>

<a-form layout="inline">
    <a-form-item label="Fallbacks">
        <a-row>
            <a-button type="primary" size="small"
                      @click="inbound.settings.addFallback()">
                +
            </a-button>
        </a-row>
    </a-form-item>
</a-form>

<a-form v-for="(fallback, index) in inbound.settings.fallbacks" layout="inline">
    <a-divider>
        fallback[[ index + 1 ]]
        <a-icon type="delete" @click="() => inbound.settings.delFallback(index)"
                style="color: rgb(255, 77, 79);cursor: pointer;"/>
    </a-divider>
    <a-form-item label="name">
        <a-input v-model="fallback.name"></a-input>
    </a-form-item>
    <a-form-item label="alpn">
        <a-input v-model="fallback.alpn"></a-input>
    </a-form-item>
    <a-form-item label="path">
        <a-input v-model="fallback.path"></a-input>
    </a-form-item>
    <a-form-item label="dest">
        <a-input v-model="fallback.dest"></a-input>
    </a-form-item>
    <a-form-item label="xver">
        <a-input type="number" v-model.number="fallback.xver"></a-input>
    </a-form-item>
    <a-divider v-if="inbound.settings.fallbacks.length - 1 === index"/>
</a-form>
{{end}}
