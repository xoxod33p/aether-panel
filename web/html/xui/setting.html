<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    @media (min-width: 769px) {
        .ant-layout-content {
            margin: 24px 16px;
        }
    }

    .ant-col-sm-24 {
        margin-top: 10px;
    }

    .ant-tabs-bar {
        margin: 0 0 16px 0;
        border-bottom: 1px solid var(--border-subtle);
    }

    .ant-list-item {
        display: block;
        padding: 20px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .settings-panel {
        background: var(--surface) !important;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        overflow: hidden;
    }
</style>
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="spinning" :delay="500" tip="Loading...">
                <a-space direction="vertical" size="large">
                    <a-space direction="horizontal">
                        <a-button type="primary" :disabled="saveBtnDisable" @click="updateAllSetting">Save Settings</a-button>
                        <a-button type="danger" :disabled="!saveBtnDisable" @click="restartPanel">Restart Panel</a-button>
                    </a-space>
                    <div class="settings-panel">
                        <a-tabs default-active-key="1" style="padding: 16px 20px 0;">
                            <a-tab-pane key="1" tab="Panel Settings">
                                <a-list item-layout="horizontal">
                                    <setting-list-item type="text" title="Panel Listen IP" desc="Leave blank to listen on all interfaces. Takes effect after restart." v-model="allSetting.webListen"></setting-list-item>
                                    <setting-list-item type="number" title="Panel Port" desc="Takes effect after restart." v-model.number="allSetting.webPort"></setting-list-item>
                                    <setting-list-item type="text" title="SSL Certificate File Path" desc="Absolute path to public certificate (.crt / .pem). Takes effect after restart." v-model="allSetting.webCertFile"></setting-list-item>
                                    <setting-list-item type="text" title="SSL Key File Path" desc="Absolute path to private key (.key). Takes effect after restart." v-model="allSetting.webKeyFile"></setting-list-item>
                                    <setting-list-item type="text" title="Panel URL Base Path" desc="Must start and end with '/'. Takes effect after restart." v-model="allSetting.webBasePath"></setting-list-item>
                                </a-list>
                            </a-tab-pane>
                            <a-tab-pane key="2" tab="User Credentials">
                                <a-form style="padding: 20px 0; max-width: 480px;">
                                    <a-form-item label="Current Username">
                                        <a-input v-model="user.oldUsername"></a-input>
                                    </a-form-item>
                                    <a-form-item label="Current Password">
                                        <a-input type="password" v-model="user.oldPassword"></a-input>
                                    </a-form-item>
                                    <a-form-item label="New Username">
                                        <a-input v-model="user.newUsername"></a-input>
                                    </a-form-item>
                                    <a-form-item label="New Password">
                                        <a-input type="password" v-model="user.newPassword"></a-input>
                                    </a-form-item>
                                    <a-form-item>
                                        <a-button type="primary" @click="updateUser">Update Credentials</a-button>
                                    </a-form-item>
                                </a-form>
                            </a-tab-pane>
                            <a-tab-pane key="3" tab="Xray Core">
                                <a-list item-layout="horizontal">
                                    <setting-list-item type="textarea" title="Xray Config Template" desc="Template used to generate final Xray JSON configuration. Takes effect after restart." v-model="allSetting.xrayTemplateConfig"></setting-list-item>
                                </a-list>
                            </a-tab-pane>
                            <a-tab-pane key="4" tab="General">
                                <a-list item-layout="horizontal">
                                    <setting-list-item type="text" title="Timezone" desc="Cron tasks and traffic reset schedules run according to this timezone." v-model="allSetting.timeLocation"></setting-list-item>
                                </a-list>
                            </a-tab-pane>
                        </a-tabs>
                    </div>
                </a-space>
            </a-spin>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
{{template "component/setting"}}
<script>
    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            siderDrawer,
            spinning: false,
            oldAllSetting: new AllSetting(),
            allSetting: new AllSetting(),
            saveBtnDisable: true,
            user: {},
        },
        methods: {
            loading(spinning = true) {
                this.spinning = spinning;
            },
            async getAllSetting() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/all");
                this.loading(false);
                if (msg.success) {
                    this.oldAllSetting = new AllSetting(msg.obj);
                    this.allSetting = new AllSetting(msg.obj);
                    this.saveBtnDisable = true;
                }
            },
            async updateAllSetting() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/update", this.allSetting);
                this.loading(false);
                if (msg.success) {
                    await this.getAllSetting();
                }
            },
            async updateUser() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/updateUser", this.user);
                this.loading(false);
                if (msg.success) {
                    this.user = {};
                }
            },
            async restartPanel() {
                await new Promise(resolve => {
                    this.$confirm({
                        title: 'Restart Panel',
                        content: 'Are you sure you want to restart the panel? It will restart in 3 seconds.',
                        okText: 'Confirm',
                        cancelText: 'Cancel',
                        onOk: () => resolve(),
                    });
                });
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/restartPanel");
                this.loading(false);
                if (msg.success) {
                    this.loading(true);
                    await PromiseUtil.sleep(5000);
                    location.reload();
                }
            }
        },
        async mounted() {
            await this.getAllSetting();
            while (true) {
                await PromiseUtil.sleep(1000);
                this.saveBtnDisable = this.oldAllSetting.equals(this.allSetting);
            }
        },
    });
</script>
</body>
</html>
