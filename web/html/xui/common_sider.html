{{define "menuItems"}}
<a-menu-item key="{{ .base_path }}xui/">
    <a-icon type="dashboard"></a-icon>
    <span>System Status</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}xui/inbounds">
    <a-icon type="user"></a-icon>
    <span>Inbounds</span>
</a-menu-item>
<a-menu-item key="{{ .base_path }}xui/setting">
    <a-icon type="setting"></a-icon>
    <span>Panel Settings</span>
</a-menu-item>
<a-sub-menu>
    <template slot="title">
        <a-icon type="link"></a-icon>
        <span>Links</span>
    </template>
    <a-menu-item key="https://github.com/xoxod33p/aether-panel">
        <a-icon type="github"></a-icon>
        <span>GitHub</span>
    </a-menu-item>
</a-sub-menu>
<a-menu-item key="{{ .base_path }}logout">
    <a-icon type="logout"></a-icon>
    <span>Logout</span>
</a-menu-item>
{{end}}

{{define "commonSider"}}
<a-layout-sider id="sider" collapsible breakpoint="md" collapsed-width="0" width="240">
    <div class="sider-brand">
        <img src="{{ .base_path }}assets/images/icon.png" class="brand-logo-img" alt="Aether VPN" onerror="this.onerror=null;this.src='{{ .base_path }}assets/images/favicon.svg';">
        <span class="brand-title">Aether VPN</span>
        <span class="brand-badge">PANEL</span>
    </div>
    <a-menu theme="dark" mode="inline" :selected-keys="['{{ .request_uri }}']"
            @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
        {{template "menuItems" .}}
    </a-menu>
</a-layout-sider>
<a-drawer id="sider-drawer" placement="left" :closable="false"
          @close="siderDrawer.close()"
          :visible="siderDrawer.visible" :wrap-style="{ padding: 0 }">
    <div class="drawer-handle" @click="siderDrawer.change()" slot="handle">
        <a-icon :type="siderDrawer.visible ? 'close' : 'menu-fold'"></a-icon>
    </div>
    <div class="sider-brand" style="background: #000000;">
        <img src="{{ .base_path }}assets/images/icon.png" class="brand-logo-img" alt="Aether VPN" onerror="this.onerror=null;this.src='{{ .base_path }}assets/images/favicon.svg';">
        <span class="brand-title">Aether VPN</span>
        <span class="brand-badge">PANEL</span>
    </div>
    <a-menu theme="dark" mode="inline" :selected-keys="['{{ .request_uri }}']"
        @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
        {{template "menuItems" .}}
    </a-menu>
</a-drawer>
<script>
    const siderDrawer = {
        visible: false,
        show() {
            this.visible = true;
        },
        close() {
            this.visible = false;
        },
        change() {
            this.visible = !this.visible;
        }
    };
</script>
{{end}}
