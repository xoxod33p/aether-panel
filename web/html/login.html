<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #000000 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #app {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: transparent !important;
    }

    .login-card {
        width: 100%;
        max-width: 384px;
        background-color: #0d0d0d;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        padding: 32px 28px 28px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
        position: relative;
        overflow: hidden;
    }

    .glow-orb {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 192px;
        height: 128px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 9999px;
        filter: blur(48px);
        pointer-events: none;
    }

    .login-header {
        text-align: center;
        margin-bottom: 24px;
        position: relative;
        z-index: 10;
    }

    .logo-container {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
        padding: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .login-header h1 {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 4px 0;
        letter-spacing: -0.3px;
    }

    .login-header p {
        color: #a3a3a3;
        font-size: 12px;
        margin: 0;
    }

    .form-group {
        margin-bottom: 16px;
        position: relative;
        z-index: 10;
    }

    .form-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #d4d4d4;
        margin-bottom: 6px;
    }

    .login-card .ant-input {
        width: 100%;
        height: 44px;
        background-color: #161616 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 12px !important;
        color: #ffffff !important;
        font-size: 13px;
        padding: 0 38px 0 14px;
        font-family: monospace;
        transition: all 0.2s ease;
    }

    .login-card .ant-input:focus {
        border-color: rgba(255, 255, 255, 0.4) !important;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08) !important;
        outline: none;
    }

    .input-icon {
        position: absolute;
        right: 14px;
        top: 35px;
        color: #737373;
        font-size: 14px;
        pointer-events: none;
    }

    .btn-submit {
        width: 100%;
        height: 44px;
        border-radius: 12px;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 13px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
        transition: all 0.2s ease;
        margin-top: 10px;
    }

    .btn-submit:hover:not([disabled]) {
        background: #e5e5e5 !important;
        color: #000000 !important;
        transform: translateY(-1px);
    }

    .btn-submit[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .login-footer {
        text-align: center;
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: #525252;
        font-size: 11px;
        position: relative;
        z-index: 10;
        font-family: monospace;
    }
</style>
<body>
<div id="app" v-cloak>
    <div class="login-card">
        <div class="glow-orb"></div>
        <div class="login-header">
            <div class="logo-container">
                <img src="{{ .base_path }}assets/images/icon.png" alt="Aether VPN" onerror="this.onerror=null;this.src='{{ .base_path }}assets/images/favicon.svg';">
            </div>
            <h1>Aether Server Manager</h1>
            <p>Authenticate to manage Aether VPN configurations</p>
        </div>
        <form @submit.prevent="login">
            <div class="form-group">
                <label class="form-label">Admin Username</label>
                <div style="position: relative;">
                    <a-input v-model.trim="user.username" placeholder="Enter admin username" autofocus></a-input>
                    <a-icon type="user" class="input-icon" />
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Admin Password</label>
                <div style="position: relative;">
                    <a-input type="password" v-model.trim="user.password" placeholder="Enter admin password"></a-input>
                    <a-icon type="lock" class="input-icon" />
                </div>
            </div>
            <button type="submit" class="btn-submit" :disabled="loading || !user.username || !user.password">
                <span>[[ loading ? 'Authenticating...' : 'Sign In' ]]</span>
                <a-icon type="arrow-right" />
            </button>
        </form>
        <div class="login-footer">
            AETHER VPN &bull; SECURE NODE PANEL
        </div>
    </div>
</div>
{{template "js" .}}
<script>
    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            loading: false,
            user: new User(),
        },
        methods: {
            async login() {
                if (!this.user.username || !this.user.password) {
                    this.$message.warning('Please enter admin credentials');
                    return;
                }
                this.loading = true;
                const msg = await HttpUtil.post('/login', this.user);
                this.loading = false;
                if (msg.success) {
                    location.href = basePath + 'xui/';
                }
            }
        }
    });
</script>
</body>
</html>
